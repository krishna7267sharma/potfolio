<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills - Krishna Sharma</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#060610;
font-family:'DM Sans',sans-serif;
color:white;
}

.section{
padding:100px 60px;
}

h1{
font-size:70px;
font-family:'Syne',sans-serif;
margin-bottom:50px;
}

h1 span{
color:#7c5af6;
}

.skill{
margin-bottom:35px;
}

.skill-title{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.bar{
height:12px;
background:#1a1a2f;
border-radius:30px;
overflow:hidden;
}

.progress{
height:100%;
background:#7c5af6;
border-radius:30px;
}

</style>
</head>

<body>

<section class="section">

<h1>My <span>Skills</span></h1>

<div class="skill">
<div class="skill-title">
<span>HTML</span>
<span>95%</span>
</div>
<div class="bar">
<div class="progress" style="width:95%"></div>
</div>
</div>

<div class="skill">
<div class="skill-title">
<span>CSS</span>
<span>90%</span>
</div>
<div class="bar">
<div class="progress" style="width:90%"></div>
</div>
</div>

<div class="skill">
<div class="skill-title">
<span>JavaScript</span>
<span>80%</span>
</div>
<div class="bar">
<div class="progress" style="width:80%"></div>
</div>
</div>

<div class="skill">
<div class="skill-title">
<span>UI/UX Design</span>
<span>85%</span>
</div>
<div class="bar">
<div class="progress" style="width:85%"></div>
</div>
</div>

</section>

</body>
</html>
