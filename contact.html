<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Krishna Sharma</title>

<style>

body{
margin:0;
background:#060610;
font-family:Arial;
color:white;
}

.section{
padding:100px 60px;
max-width:700px;
margin:auto;
}

h1{
font-size:70px;
margin-bottom:20px;
}

h1 span{
color:#7c5af6;
}

p{
color:#b5b5c7;
margin-bottom:40px;
line-height:1.8;
}

form{
display:flex;
flex-direction:column;
gap:20px;
}

input,textarea{
padding:18px;
background:#111122;
border:1px solid rgba(255,255,255,0.08);
border-radius:12px;
color:white;
font-size:16px;
outline:none;
}

button{
padding:16px;
background:#7c5af6;
border:none;
border-radius:12px;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#9b7fff;
}

</style>
</head>

<body>

<section class="section">

<h1>Contact <span>Me</span></h1>

<p>
Have a project idea or want to work together?
Send me a message and let's create something amazing.
</p>

<form>

<input type="text" placeholder="Your Name">

<input type="email" placeholder="Your Email">

<textarea rows="6" placeholder="Your Message"></textarea>

<button>Send Message</button>

</form>

</section>

</body>
</html>
