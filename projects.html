<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects - Krishna Sharma</title>

<style>

body{
margin:0;
background:#060610;
font-family:Arial;
color:white;
}

.section{
padding:100px 60px;
}

h1{
font-size:70px;
margin-bottom:50px;
}

h1 span{
color:#7c5af6;
}

.projects{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
}

.project{
background:#111122;
padding:30px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.08);
transition:0.3s;
}

.project:hover{
transform:translateY(-10px);
border-color:#7c5af6;
}

.project h2{
margin-bottom:15px;
}

.project p{
color:#b5b5c7;
line-height:1.8;
}

</style>
</head>

<body>

<section class="section">

<h1>My <span>Projects</span></h1>

<div class="projects">

<div class="project">
<h2>Portfolio Website</h2>
<p>
Modern animated portfolio website with responsive design and smooth user experience.
</p>
</div>

<div class="project">
<h2>Landing Page</h2>
<p>
Creative business landing page with modern UI and conversion focused sections.
</p>
</div>

<div class="project">
<h2>Dashboard UI</h2>
<p>
Clean admin dashboard interface designed with dark modern aesthetics.
</p>
</div>

</div>

</section>

</body>
</html>
